<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عربة التسوق | سوق مكسب</title>
  <meta name="description" content="عربة التسوق الآمنة لشراء المنتجات مكسب مع مراجعة الأسعار وتطبيق كوبونات الخصم.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>

  <div data-site-header></div>

  <!-- Cart Page Layout (Amazon Architecture) -->
  <main class="container" style="padding-top: var(--space-16); padding-bottom: var(--space-48);">
    <div id="cart-content-area">
      <!-- Injected via JS -->
      <div style="background:#fff; border:1px solid var(--border); border-radius:var(--radius-sm); padding:48px; text-align:center;">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size:32px; color:var(--accent);"></i>
        <p style="margin-top:16px; color:var(--text-secondary);">جارٍ تحميل محتويات سلة التسوق الخاصة بك...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div data-site-footer></div>

  <script src="/js/app.js"></script>
  <script>
    async function initCartPage() {
      // 1. Auth check for header
      const user = await App.auth.me();
      if (user) {
        const namePart = user.name ? user.name.split(' ')[0] : 'عزيزنا';
      }

      // 2. Load Sections in header
      // 3. Render Cart
      renderCartPage();
    }

    function renderCartPage() {
      const items = App.cart.get();
      const container = document.getElementById('cart-content-area');

      if (!items.length) {
        container.innerHTML = `
          <div class="empty-state-box" style="margin: 32px auto;">
            <i class="fa-solid fa-cart-shopping empty-state-icon"></i>
            <h2>عربة التسوق في سوق مكسب فارغة</h2>
            <p>تصفح أحدث السلع المفحوصة مكسب المعروضة اليوم وأضف ما يعجبك لسلتك.</p>
            <a href="/products.html" class="button btn-accent">تصفح المعروضات الآن</a>
          </div>
        `;
        return;
      }

      const total = App.cart.total();
      const totalUnits = items.reduce((sum, item) => sum + item.quantity, 0);

      container.innerHTML = `
        <div class="cart-layout">

          <!-- Left Column: Items Panel -->
          <div class="cart-items-panel">
            <div class="cart-panel-head">
              <h1>عربة التسوق</h1>
              <span class="cart-price-col-header">السعر</span>
            </div>

            <div id="cart-items-list">
              ${items.map(item => {
                const itemPrice = item.final_price !== undefined ? item.final_price : item.price;
                const lineTotal = itemPrice * item.quantity;
                const maxQty = 10;
                let qtyOptions = '';
                for (let q = 1; q <= maxQty; q++) {
                  qtyOptions += `<option value="${q}" ${q === item.quantity ? 'selected' : ''}>${q}</option>`;
                }

                return `
                  <div class="cart-item-row">
                    <div class="cart-item-thumb">
                      <img src="${App.escapeHtml(item.image)}" alt="${App.escapeHtml(item.name)}" onerror="App.imgFallback(this)">
                    </div>

                    <div class="cart-item-details">
                      <span class="badge badge-neutral" style="font-size:11px; margin-bottom:4px;">${App.escapeHtml(item.section_name || 'عام')}</span>
                      <div>
                        <a href="/product.html?id=${item.id}" class="cart-item-name">${App.escapeHtml(item.name)}</a>
                      </div>
                      <div class="cart-item-stock">
                        <i class="fa-solid fa-check" style="color:var(--success);"></i>
                        <span>متوفر وجاهز للتسليم | بائع موثوق</span>
                      </div>

                      <div class="cart-item-actions">
                        <div class="cart-qty-pill">
                          <label for="qty-${item.id}">الكمية:</label>
                          <select id="qty-${item.id}" class="cart-qty-select" onchange="handleQtySelect('${item.id}', this.value)">
                            ${qtyOptions}
                          </select>
                        </div>
                        <button class="cart-action-btn delete-btn" onclick="handleRemoveItem('${item.id}')" title="حذف من السلة">
                          <i class="fa-regular fa-trash-can"></i> حذف
                        </button>
                        <a href="/product.html?id=${item.id}" class="cart-action-btn">
                          <i class="fa-solid fa-arrow-up-right-from-square"></i> تفاصيل السلعة
                        </a>
                      </div>
                    </div>

                    <div class="cart-item-price-col">
                      <div class="cart-item-price">${App.formatPrice(lineTotal)}</div>
                      ${item.quantity > 1 ? `<div class="cart-item-unit-price">(${App.formatPrice(itemPrice)} للقطعة)</div>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:20px;">
              <button class="button btn-secondary btn-sm" onclick="handleClearCart()">
                <i class="fa-regular fa-trash-can"></i> تفريغ السلة بالكامل
              </button>
              <div class="cart-subtotal-line" style="border:none; padding:0;">
                المجموع الفرعي (${totalUnits} سلع): <strong>${App.formatPrice(total)}</strong>
              </div>
            </div>
          </div>

          <!-- Right Column: Order Summary (Amazon Buy Box Style) -->
          <aside class="cart-summary-box">
            <div class="free-delivery-badge">
              <i class="fa-solid fa-truck-fast"></i>
              <span>مؤهل للتسليم المباشر والمجاني مع البائع</span>
            </div>

            <div class="summary-row">
              <span>المجموع الفرعي (${totalUnits} سلع):</span>
              <span style="font-weight:700; color:var(--text-primary);">${App.formatPrice(total)}</span>
            </div>

            <div class="summary-row">
              <span>الشحن والتسليم:</span>
              <span style="font-weight:700; color:var(--success);">مجاناً (تنسيق مباشر)</span>
            </div>

            <!-- Coupon Input -->
            <div class="summary-coupon-form" style="border-top: 1px solid var(--border-light); padding-top: 14px; margin-top: 12px;">
              <label for="coupon-code-input" style="font-size:12px; font-weight:700; display:block; margin-bottom:6px;">كوبون الخصم (إن وجد):</label>
              <div class="input-group">
                <input type="text" id="coupon-code-input" class="input" placeholder="رمز الكوبون..." style="text-transform:uppercase;">
              </div>
              <small style="font-size:11px; color:var(--text-secondary); display:block; margin-top:4px;">
                * يُفحص ويُطبّق الخصم لحظياً عند إنشاء الطلب. كل كوبون يصدره بائع لمتجره ويُطبَّق على منتجات هذا البائع فقط.
              </small>
            </div>

            <!-- Total Price -->
            <div class="summary-row total">
              <span>المبلغ الإجمالي:</span>
              <span style="color:var(--warning); font-size:22px;">${App.formatPrice(total)}</span>
            </div>

            <button id="btn-checkout" class="button btn-accent btn-block" style="margin-top:16px; height:44px; font-size:15px;" onclick="handleCheckout()">
              متابعة الدفع وإنهاء الطلب
            </button>

            <div id="checkout-feedback" style="margin-top: 12px;"></div>

            <div style="font-size:11px; color:var(--text-secondary); margin-top:16px; line-height:1.5;">
              بالضغط على "متابعة الدفع وإنهاء الطلب"، يتم إرسال تفاصيل الطلب وبيانات التواصل إلى البائعين المعنيين لتحضير السلعة.
            </div>
          </aside>

        </div>
      `;
    }

    function handleQtySelect(id, val) {
      const q = parseInt(val, 10);
      App.cart.update(id, q);
      renderCartPage();
    }

    function handleRemoveItem(id) {
      App.cart.remove(id);
      renderCartPage();
    }

    function handleClearCart() {
      if (confirm('هل أنت متأكد من تفريغ كافة المنتجات من سلة التسوق؟')) {
        App.cart.clear();
        renderCartPage();
      }
    }

    async function handleCheckout() {
      const user = await App.auth.me();
      if (!user) {
        App.showToast('يجب تسجيل الدخول لإتمام عملية الشراء', 'warning');
        setTimeout(() => {
          window.location.href = `/login.html?redirect=${encodeURIComponent('/cart.html')}`;
        }, 800);
        return;
      }

      const items = App.cart.get();
      if (!items.length) {
        App.showToast('عربة التسوق فارغة', 'warning');
        return;
      }

      const couponInput = document.getElementById('coupon-code-input');
      const couponCode = couponInput ? couponInput.value.trim() : '';

      const btn = document.getElementById('btn-checkout');
      btn.disabled = true;
      btn.innerText = 'جارٍ معالجة وتأكيد الطلب...';

      // Send only product ID and quantity per system requirements
      const payload = {
        products: items.map(i => ({
          id: i.id,
          quantity: i.quantity,
        })),
      };

      if (couponCode) {
        payload.coupon = couponCode;
      }

      const res = await App.fetchAPI('/api/order', {
        method: 'POST',
        body: JSON.stringify(payload),
      });

      btn.disabled = false;
      btn.innerText = 'متابعة الدفع وإنهاء الطلب';

      if (res.ok) {
        App.cart.clear();
        document.getElementById('cart-content-area').innerHTML = `
          <div class="empty-state-box" style="margin: 32px auto; max-width: 640px;">
            <div style="width: 70px; height: 70px; background: var(--success-bg); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px;">
              <i class="fa-solid fa-check"></i>
            </div>
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">تم تسجيل طلبك بنجاح!</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 15px; line-height: 1.6;">
              شكراً لتسوقك من سوق مكسب. تم إرسال إشعار فوري وتفاصيل الطلب إلى البائعين للبدء في تحضير السلعة والتواصل معك للتسليم.
            </p>
            <div style="display: flex; gap: 12px; justify-content: center;">
              <a href="/orders.html" class="button btn-accent">عرض سجل طلباتي</a>
              <a href="/products.html" class="button btn-secondary">متابعة التسوق</a>
            </div>
          </div>
        `;
        App.showToast('تم إنشاء طلب الشراء بنجاح', 'success');
      } else {
        const feedback = document.getElementById('checkout-feedback');
        feedback.innerHTML = `
          <div style="background: var(--error-bg); color: var(--error); border: 1px solid #FECDD3; border-radius: var(--radius-xs); padding: 10px 12px; font-size: 13px;">
            <i class="fa-solid fa-triangle-exclamation"></i> ${App.escapeHtml(res.message || 'تعذر إتمام الطلب، يرجى التأكد من توفر الكمية')}
          </div>
        `;
        App.showToast(res.message || 'تعذر إتمام الطلب', 'danger');
      }
    }

    window.addEventListener('DOMContentLoaded', initCartPage);
  </script>
</body>
</html>
