<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل طلباتي ومشترياتي | سوق مكسب</title>
  <meta name="description" content="تتبع حالة شحن وتوصيل مشترياتك المكسبة مع شريط التتبع الذكي والفواتير الرقمية.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>

  <!-- Invoice Modal (Amazon Style) -->
  <div class="invoice-modal-backdrop" id="invoice-modal-backdrop" style="display:none;" onclick="closeInvoiceModal()">
    <div class="invoice-modal-dialog" onclick="event.stopPropagation()">
      <div class="invoice-modal-header">
        <h3 style="font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px;">
          <i class="fa-solid fa-file-invoice"></i> ملخص وفاتورة الشراء الرسمية
        </h3>
        <button class="button btn-secondary btn-sm" onclick="closeInvoiceModal()" style="height:28px; padding:0 8px;">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="invoice-modal-body" id="invoice-modal-content">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <div data-site-header></div>

  <!-- Orders Content (Amazon Architecture) -->
  <main class="container orders-page">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom: 20px;">
      <div>
        <h1>طلباتك ومشترياتك</h1>
        <p style="color:var(--text-secondary); font-size:14px; margin:0;">
          تتبع مسار شحن المعروضات المكسبة، وتواصل مع البائعين، وحمّل إيصالات الاستلام.
        </p>
      </div>
      <button class="button btn-secondary btn-sm" onclick="loadOrders()">
        <i class="fa-solid fa-rotate"></i> تحديث الحالة الآن
      </button>
    </div>

    <!-- Filter Tabs (Amazon Style) -->
    <div class="orders-tabs">
      <button class="orders-tab-btn is-active" data-filter="all" onclick="filterOrdersTab('all', this)">كل الطلبات</button>
      <button class="orders-tab-btn" data-filter="active" onclick="filterOrdersTab('active', this)">قيد المعالجة والتوصيل</button>
      <button class="orders-tab-btn" data-filter="delivered" onclick="filterOrdersTab('delivered', this)">الطلبات المكتملة</button>
      <button class="orders-tab-btn" data-filter="cancelled" onclick="filterOrdersTab('cancelled', this)">الملغاة</button>
    </div>

    <!-- Orders Cards Container -->
    <div id="orders-list-container">
      <div style="background:#fff; border:1px solid var(--border); border-radius:var(--radius-sm); padding:48px; text-align:center;">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size:32px; color:var(--accent);"></i>
        <p style="margin-top:16px; color:var(--text-secondary);">جارٍ جلب وتحديث سجل طلباتك...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div data-site-footer></div>

  <script src="/js/app.js"></script>
  <script>
    let allUserOrders = [];
    let currentTabFilter = 'all';

    async function initOrdersPage() {
      // 1. Auth check
      const user = await App.auth.requireAuth();
      if (!user) return;

      const namePart = user.name ? user.name.split(' ')[0] : 'عزيزنا';

      // 2. Sections
      // 3. Load Orders
      await loadOrders();
    }

    async function loadOrders() {
      const container = document.getElementById('orders-list-container');
      const res = await App.fetchAPI('/api/get_user_orders');

      if (res.ok && Array.isArray(res.data) && res.data.length > 0) {
        allUserOrders = res.data;
        renderOrdersList();
      } else {
        allUserOrders = [];
        container.innerHTML = `
          <div class="empty-state-box" style="margin: 24px auto;">
            <i class="fa-solid fa-box-open empty-state-icon"></i>
            <h2>لم تقم بإجراء أي طلبات شراء بعد</h2>
            <p>عندما تشتري منتجاً مكسباً من المنصة، ستتمكن من تتبع حالة شحنه وتفاصيله هنا.</p>
            <a href="/products.html" class="button btn-accent">تصفح المعروضات الآن</a>
          </div>
        `;
      }
    }

    function filterOrdersTab(filter, btn) {
      currentTabFilter = filter;
      document.querySelectorAll('.orders-tab-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      renderOrdersList();
    }

    function renderOrdersList() {
      const container = document.getElementById('orders-list-container');
      let filtered = [...allUserOrders];

      if (currentTabFilter === 'active') {
        filtered = filtered.filter(o => ['new', 'processing', 'shipped'].includes(String(o.status_order || o.status || 'new').toLowerCase()));
      } else if (currentTabFilter === 'delivered') {
        filtered = filtered.filter(o => String(o.status_order || o.status || '').toLowerCase() === 'delivered');
      } else if (currentTabFilter === 'cancelled') {
        filtered = filtered.filter(o => String(o.status_order || o.status || '').toLowerCase() === 'cancelled');
      }

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-state-box" style="margin: 20px auto;">
            <i class="fa-solid fa-magnifying-glass empty-state-icon"></i>
            <h2>لا توجد طلبات مطابقة لهذا القسم</h2>
            <p>اختر قسماً آخر أو قم بالعودة لعرض كافة الطلبات.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(order => {
        const orderId = order._id || order.id || 'N/A';
        const orderDate = order.createdAt ? new Date(order.createdAt).toLocaleDateString('ar-EG', { dateStyle: 'long' }) : 'مؤخراً';
        const rawStatus = String(order.status_order || order.status || 'new').toLowerCase();
        const products = order.products || [];

        // Progress Tracker Steps calculation
        const steps = ['new', 'processing', 'shipped', 'delivered'];
        const currentIdx = steps.indexOf(rawStatus);
        const isCancelled = rawStatus === 'cancelled';

        let statusText = 'تم استلام الطلب وتأكيده';
        let statusBannerClass = '';
        if (rawStatus === 'processing') statusText = 'قيد التجهيز والفحص من البائع';
        if (rawStatus === 'shipped') statusText = 'السلعة في طريقها إليك الآن (قيد الشحن والتسليم)';
        if (rawStatus === 'delivered') {
          statusText = 'تم التوصيل والاستلام بنجاح';
          statusBannerClass = 'is-delivered';
        }
        if (isCancelled) {
          statusText = 'تم إلغاء هذا الطلب';
          statusBannerClass = 'is-cancelled';
        }

        return `
          <div class="order-card">
            <!-- Header bar (Amazon Style) -->
            <div class="order-card-header">
              <div class="order-header-meta">
                <div class="order-meta-col">
                  <span class="order-meta-label">تم تقديم الطلب في</span>
                  <span class="order-meta-val">${orderDate}</span>
                </div>
                <div class="order-meta-col">
                  <span class="order-meta-label">المبلغ الإجمالي</span>
                  <span class="order-meta-val" style="color:var(--text-primary); font-size:14px;">${App.formatPrice(order.total_price || 0)}</span>
                </div>
                <div class="order-meta-col">
                  <span class="order-meta-label">التسليم إلى</span>
                  <span class="order-meta-val" style="color:var(--link); cursor:pointer;" onclick="window.location.href='/profile.html'">عنوان حسابك المسجل</span>
                </div>
              </div>

              <div class="order-header-right">
                <div class="order-meta-col" style="text-align:left;">
                  <span class="order-meta-label">الطلب رقم #${orderId.slice(-8).toUpperCase()}</span>
                  <button class="button btn-secondary btn-sm" onclick="openInvoiceModal('${orderId}')" style="height:28px; padding:0 10px; font-size:12px; margin-top:3px;">
                    <i class="fa-solid fa-file-invoice"></i> عرض الفاتورة
                  </button>
                </div>
              </div>
            </div>

            <!-- Card Body -->
            <div class="order-card-body">
              <!-- Status Banner -->
              <div class="order-status-banner ${statusBannerClass}">
                <div class="order-status-title">
                  <i class="fa-solid ${isCancelled ? 'fa-ban' : rawStatus === 'delivered' ? 'fa-circle-check' : 'fa-truck-ramp-box'}" style="color:${isCancelled ? 'var(--error)' : rawStatus === 'delivered' ? 'var(--success)' : 'var(--accent-hover)'};"></i>
                  <span>${statusText}</span>
                </div>
                <span class="order-status-desc">تحديثات فورية مباشرة من متجر البائع</span>
              </div>

              <!-- Horizontal Progress Tracker -->
              ${!isCancelled ? `
                <div class="order-tracker">
                  <div class="tracker-steps">
                    <div class="tracker-step ${currentIdx >= 0 ? 'is-active' : ''} ${currentIdx === 0 ? 'is-current' : ''}">
                      <div class="tracker-bullet"><i class="fa-solid fa-receipt"></i></div>
                      <div class="tracker-label">تم الطلب</div>
                    </div>
                    <div class="tracker-line ${currentIdx >= 1 ? 'is-active' : ''}"></div>

                    <div class="tracker-step ${currentIdx >= 1 ? 'is-active' : ''} ${currentIdx === 1 ? 'is-current' : ''}">
                      <div class="tracker-bullet"><i class="fa-solid fa-box-open"></i></div>
                      <div class="tracker-label">التجهيز</div>
                    </div>
                    <div class="tracker-line ${currentIdx >= 2 ? 'is-active' : ''}"></div>

                    <div class="tracker-step ${currentIdx >= 2 ? 'is-active' : ''} ${currentIdx === 2 ? 'is-current' : ''}">
                      <div class="tracker-bullet"><i class="fa-solid fa-truck"></i></div>
                      <div class="tracker-label">الشحن</div>
                    </div>
                    <div class="tracker-line ${currentIdx >= 3 ? 'is-active' : ''}"></div>

                    <div class="tracker-step ${currentIdx >= 3 ? 'is-active' : ''}">
                      <div class="tracker-bullet"><i class="fa-solid fa-house-chimney-check"></i></div>
                      <div class="tracker-label">تم التسليم</div>
                    </div>
                  </div>
                </div>
              ` : ''}

              <!-- Products Rows -->
              <div class="order-items-list">
                ${products.map(p => {
                  const pData = p.product_id || p;
                  const name = pData.name || p.name || 'منتج مكسب';
                  const img = (Array.isArray(pData.images) && pData.images[0]) ? pData.images[0] : (pData.image || App.FALLBACK_IMG);
                  const qty = p.quantity || 1;
                  const price = pData.final_price !== undefined ? pData.final_price : (pData.price || 0);
                  // FIX: an order line item is a snapshot with its OWN _id (the
                  // line's id), which is NOT the product's id. The real product
                  // id is the `product` reference saved on the line (models/order.js).
                  // Using `_id` here sent people to product.html with an id that
                  // matches no product, so it always said "not available".
                  const productRef = p.product || p.product_id;
                  const rawProdId = productRef && typeof productRef === 'object'
                    ? (productRef._id || productRef.id || '')
                    : (productRef || '');
                  const prodId = /^[a-f0-9]{24}$/i.test(String(rawProdId)) ? String(rawProdId) : '';

                  return `
                    <div class="order-product-row">
                      <div class="order-product-main">
                        <div class="order-product-thumb">
                          <img src="${App.escapeHtml(img)}" alt="${App.escapeHtml(name)}" onerror="App.imgFallback(this)">
                        </div>
                        <div class="order-product-info">
                          ${prodId
                            ? `<a href="/product.html?id=${prodId}" class="order-product-name">${App.escapeHtml(name)}</a>`
                            : `<span class="order-product-name">${App.escapeHtml(name)}</span>`}
                          <div class="order-product-meta">
                            <span>الكمية: <strong>${qty}</strong></span>
                            <span>•</span>
                            <span class="order-product-price-badge">${App.formatPrice(price)}</span>
                          </div>
                        </div>
                      </div>

                      <div class="order-product-actions">
                        ${prodId ? `
                        <a href="/product.html?id=${prodId}" class="button btn-accent btn-sm">
                          <i class="fa-solid fa-arrow-rotate-right"></i> اشتره ثانيةً
                        </a>
                        <a href="/product.html?id=${prodId}" class="button btn-secondary btn-sm">
                          تفاصيل السلعة
                        </a>` : `
                        <span style="font-size:12px; color:var(--text-secondary);">تفاصيل هذه السلعة غير متاحة (طلب قديم)</span>`}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Footer Details -->
            <div class="order-card-footer">
              <span style="font-size:12px; color:var(--text-secondary);">
                <i class="fa-solid fa-shield-halved" style="color:var(--success);"></i> مشمول بحماية المعاينة والفحص المباشر في سوق المكسب
              </span>
              <a href="/products.html" class="button btn-secondary btn-sm">
                متابعة تصفح السوق &larr;
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function openInvoiceModal(orderId) {
      const order = allUserOrders.find(o => (o._id || o.id) === orderId);
      if (!order) return;

      const modal = document.getElementById('invoice-modal-backdrop');
      const content = document.getElementById('invoice-modal-content');
      const orderDate = order.createdAt ? new Date(order.createdAt).toLocaleString('ar-EG') : 'حديثاً';
      const products = order.products || [];

      content.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
          <div>
            <h4 style="font-size:16px; font-weight:800; color:var(--primary);">سوق المكسب</h4>
            <div style="font-size:12px; color:var(--text-secondary);">فاتورة طلب إلكترونية رسمية</div>
          </div>
          <div style="text-align:left;">
            <div style="font-weight:700;">رقم الطلب: #${(order._id || order.id || '').slice(-8).toUpperCase()}</div>
            <div style="font-size:12px; color:var(--text-secondary);">${orderDate}</div>
          </div>
        </div>

        <table class="invoice-table">
          <thead>
            <tr>
              <th>السلعة المكسبة</th>
              <th>الكمية</th>
              <th>سعر الوحدة</th>
              <th>الإجمالي</th>
            </tr>
          </thead>
          <tbody>
            ${products.map(p => {
              const pData = p.product_id || p;
              const name = pData.name || p.name || 'منتج مكسب';
              const qty = p.quantity || 1;
              const price = pData.final_price !== undefined ? pData.final_price : (pData.price || 0);
              return `
                <tr>
                  <td><strong>${App.escapeHtml(name)}</strong></td>
                  <td>${qty}</td>
                  <td>${App.formatPrice(price)}</td>
                  <td><strong>${App.formatPrice(price * qty)}</strong></td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>

        <div style="display:flex; justify-content:flex-end; margin-top:16px; border-top:1px solid var(--border); padding-top:12px;">
          <div style="width:240px; display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; justify-content:space-between; font-size:13px;">
              <span>المجموع الفرعي:</span>
              <span>${App.formatPrice(order.total_price || 0)}</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:13px;">
              <span>الشحن والتسليم:</span>
              <span style="color:var(--success);">مجاناً</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:800; border-top:1px solid var(--border-light); padding-top:6px; margin-top:4px;">
              <span>المجموع الكلي:</span>
              <span style="color:var(--warning);">${App.formatPrice(order.total_price || 0)}</span>
            </div>
          </div>
        </div>

        <div style="margin-top:24px; text-align:center;">
          <button class="button btn-secondary btn-sm" onclick="window.print()">
            <i class="fa-solid fa-print"></i> طباعة الفاتورة
          </button>
        </div>
      `;

      modal.style.display = 'flex';
    }

    function closeInvoiceModal() {
      document.getElementById('invoice-modal-backdrop').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', initOrdersPage);
    window.addEventListener('market:update_status', () => loadOrders());
  </script>
</body>
</html>
